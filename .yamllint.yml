extends: default

ignore: |
  .fvm/
  build/
  node_modules/
  .venv/
  # Agent worktrees are full clones of this repository: each lints itself.
  .claude/worktrees/

rules:
  document-start: disable
  line-length:
    max: 140
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
