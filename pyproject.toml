# SPDX-License-Identifier: GPL-3.0-or-later

[project]
name = "zadrya-data"
version = "0.1.0"
description = "Pipeline that builds, validates and signs the Zadrya substance dataset"
license = "GPL-3.0-or-later"
authors = [{ name = "Sklyvan" }]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=zadrya_data --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "types-jsonschema>=4.26.0.20261006",
]
