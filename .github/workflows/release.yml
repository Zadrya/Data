# SPDX-License-Identifier: GPL-3.0-or-later
# Signs and publishes the dataset committed on main as the release dataset-vX.Y.Z.
# The design is in docs/adr/0006-release.md, the procedure in the release-dataset skill.
# Only the sign job can read the key, and it waits for the owner's approval of the
# release environment.
name: Release

on:
  workflow_dispatch:
    inputs:
      dataset_version:
        description: "datasetVersion inside the committed dataset/substances.json (X.Y.Z)"
        required: true
        type: string
      min_app_version:
        description: "Lowest app version that can use this dataset (X.Y.Z)"
        required: true
        type: string
      date:
        description: "Release date for the manifest (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One release at a time, and a release that has started is never cancelled.
  group: release
  cancel-in-progress: false

env:
  DATASET_VERSION: ${{ inputs.dataset_version }}
  MIN_APP_VERSION: ${{ inputs.min_app_version }}
  RELEASE_DATE: ${{ inputs.date }}

jobs:
  check:
    name: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          # setup-uv does not know this release yet, so the checksum is pinned here.
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Check the inputs
        run: |
          version='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$DATASET_VERSION" =~ $version ]] || { echo "dataset_version is not X.Y.Z" >&2; exit 1; }
          [[ "$MIN_APP_VERSION" =~ $version ]] || { echo "min_app_version is not X.Y.Z" >&2; exit 1; }
          [[ "$RELEASE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "date is not YYYY-MM-DD" >&2; exit 1; }
      - name: Check that the tag is new and the version is higher than every dataset release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dataset-v$DATASET_VERSION"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" || status=$?
          [[ "$status" == 2 ]] || { echo "the tag $tag exists already, or the check failed" >&2; exit 1; }
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name | select(startswith("dataset-v")) | ltrimstr("dataset-v")')
          # One version per line; a new version must sort after every one of them.
          highest=$(printf '%s\n' "$previous" "$DATASET_VERSION" | sort -V | tail -n 1)
          if [[ "$highest" != "$DATASET_VERSION" ]] || grep -qxF "$DATASET_VERSION" <<< "$previous"; then
            echo "$DATASET_VERSION is not above every dataset release ($highest)" >&2
            exit 1
          fi
      - name: Check the committed dataset (schema and datasetVersion) and its manifest
        run: >-
          uv run --locked --no-dev zadrya-data manifest dataset/substances.json
          --dataset-version "$DATASET_VERSION" --min-app-version "$MIN_APP_VERSION"
          --date "$RELEASE_DATE" --output "$RUNNER_TEMP/manifest.json"

  sign:
    name: sign
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The owner approves this job. Only it can read DATASET_SIGNING_KEY, a secret
    # of this environment. No cache of any kind is used here.
    environment: release
    outputs:
      signature: ${{ steps.sign.outputs.signature }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          # setup-uv does not know this release yet, so the checksum is pinned here.
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Write the signing key to a file only the runner user can read
        env:
          # The only place the secret enters: this step's environment. printf is a
          # shell builtin, so the key is never part of a command line.
          DATASET_SIGNING_KEY: ${{ secrets.DATASET_SIGNING_KEY }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/dataset-signing-key.pem"
          printf '%s\n' "$DATASET_SIGNING_KEY" | sed -e '/^$/d' > "$key_file"
          chmod 600 "$key_file"
      - name: Sign the committed dataset
        id: sign
        env:
          ZADRYA_SIGNING_KEY_FILE: ${{ runner.temp }}/dataset-signing-key.pem
        run: |
          ulimit -c 0
          uv run --locked --no-dev zadrya-data sign dataset/substances.json \
            --dataset-version "$DATASET_VERSION" --output "$RUNNER_TEMP/substances.json.sig"
          echo "signature=$(cat "$RUNNER_TEMP/substances.json.sig")" >> "$GITHUB_OUTPUT"
      - name: Delete the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/dataset-signing-key.pem"

  publish:
    name: publish
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release; this job cannot read the key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          # setup-uv does not know this release yet, so the checksum is pinned here.
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Assemble the three files and verify them as the app does
        env:
          SIGNATURE: ${{ needs.sign.outputs.signature }}
        run: |
          mkdir dist
          cp dataset/substances.json dist/substances.json
          printf '%s\n' "$SIGNATURE" > dist/substances.json.sig
          uv run --locked --no-dev zadrya-data manifest dist/substances.json \
            --dataset-version "$DATASET_VERSION" --min-app-version "$MIN_APP_VERSION" \
            --date "$RELEASE_DATE" --output dist/manifest.json
          uv run --locked --no-dev zadrya-data verify dist \
            --dataset-version "$DATASET_VERSION" > "$RUNNER_TEMP/verified.txt"
          cat "$RUNNER_TEMP/verified.txt"
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dataset-v$DATASET_VERSION"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" || status=$?
          [[ "$status" == 2 ]] || { echo "the tag $tag exists already, or the check failed" >&2; exit 1; }
          {
            echo "Dataset $DATASET_VERSION, signed from commit $GITHUB_SHA."
            echo
            echo '```text'
            cat "$RUNNER_TEMP/verified.txt"
            echo '```'
            echo
            echo "Check it with \`uv run zadrya-data verify --release $tag\` in a clone of this repository."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" dist/substances.json dist/substances.json.sig dist/manifest.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Dataset $DATASET_VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest

  verify-published:
    name: verify-published
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          # setup-uv does not know this release yet, so the checksum is pinned here.
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Download the published assets and verify them against the pinned keys
        run: |
          uv run --locked --no-dev zadrya-data verify --release "dataset-v$DATASET_VERSION" \
            --dataset-version "$DATASET_VERSION"
          uv run --locked --no-dev zadrya-data verify --release latest \
            --dataset-version "$DATASET_VERSION"
